# Reusable consumer-test workflow. Triggered by manager's
# repository_dispatch:[upstream-bumped] in each affected consumer.
#
# Runs the consumer's own test suite against the just-published
# bumped versions. Result lives in the consumer's Actions tab.
#
# Standardized on bun in line with the org-wide migration. Server is
# the only repo that still routes through npm (see its package-lock.json
# branch in deploy-reusable.yml); consumer tests run everywhere else.

name: Consumer test (reusable)

on:
  workflow_call:
    inputs:
      # Where the npm INSTALL token lives in Infisical. Same defaults and
      # rationale as test-reusable.yml: NPM_TOKEN_PUBLISH exists ONLY in
      # project a95028f1 (`staging`, `production`); the critical project
      # holds just the read-scoped NPM_TOKEN, which 404s on a cold
      # `bun install` of restricted @symbo.ls/* packages.
      infisical_npm_project:
        type: string
        required: false
        default: 'a95028f1-c89b-4d5e-87a2-d6badfb3ab4b'
      # `production` matches the env release-manager's release.yml reads
      # this key from with a working identity (roles are env-scoped).
      infisical_npm_env:
        type: string
        required: false
        default: 'production'
      infisical_npm_key:
        type: string
        required: false
        default: 'NPM_TOKEN_PUBLISH'
    secrets:
      NPM_TOKEN:
        required: false
      # Kept declared for caller compatibility; NOT consumed here anymore
      # — GitHub Packages was retired on 2026-08-25, every package
      # resolves from registry.npmjs.org with NPM_TOKEN.
      RELEASE_PAT:
        required: false
      INFISICAL_CLIENT_ID:
        required: false
      INFISICAL_CLIENT_SECRET:
        required: false
      INFISICAL_PROJECT_ID:
        required: false
      INFISICAL_DOMAIN:
        required: false

jobs:
  consumer-test:
    runs-on: namespace-profile-smbls
    timeout-minutes: 20
    steps:
      - name: Echo dispatch payload
        run: |
          echo "Source repo:    ${{ github.event.client_payload.source_repo }}"
          echo "Source SHA:     ${{ github.event.client_payload.source_sha }}"
          echo "Bumped pkgs:    ${{ github.event.client_payload.bumped_packages }}"
          echo "Bumped vers:    ${{ github.event.client_payload.bumped_versions }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pin bun to the repo's declared `packageManager` (workspace pins
      # bun@1.3.14). `latest` rewrites bun.lock to lockfile v3, which the
      # pinned local toolchain cannot read. See test-reusable.yml.
      - name: Resolve bun version from package.json
        id: bunv
        shell: bash
        run: |
          v=$(jq -r '.packageManager // "" | select(startswith("bun@")) | ltrimstr("bun@")' package.json 2>/dev/null || true)
          echo "version=${v:-latest}" >> "$GITHUB_OUTPUT"
          echo "bun version: ${v:-latest} (from package.json packageManager)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bunv.outputs.version }}
          # Authenticated GH API lookup for `bun-version: latest` —
          # avoids 401 on rate-limit exhaustion. See test-reusable.yml
          # for full rationale.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache bun + node_modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Resolve the npm INSTALL token from Infisical — identical to the
      # step in test-reusable.yml (see the rationale there). OPTIONAL and
      # fails SOFT: without creds, or on any login/fetch failure, the
      # next step falls back to `secrets.NPM_TOKEN` exactly as before.
      - name: Resolve npm install token from Infisical
        shell: bash
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          NPM_PROJECT: ${{ inputs.infisical_npm_project }}
          NPM_ENV: ${{ inputs.infisical_npm_env }}
          NPM_KEY: ${{ inputs.infisical_npm_key }}
        run: |
          if [ -z "${INFISICAL_CLIENT_ID:-}" ] || [ -z "${INFISICAL_CLIENT_SECRET:-}" ]; then
            echo "::notice::Infisical not configured on this repo — using the static NPM_TOKEN secret."
            exit 0
          fi

          if ! command -v infisical > /dev/null 2>&1; then
            INF_VER=0.43.79
            if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
                 "https://github.com/Infisical/cli/releases/download/v${INF_VER}/cli_${INF_VER}_linux_amd64.tar.gz" -o /tmp/infisical.tgz; then
              sudo tar -xzf /tmp/infisical.tgz -C /usr/local/bin infisical
              sudo chmod +x /usr/local/bin/infisical
            else
              echo "::warning::GitHub release download failed — falling back to Infisical apt repo."
              curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo bash
              sudo apt-get install -y "infisical=${INF_VER}"
            fi
          fi

          CLEAN_CID=$(printf '%s' "$INFISICAL_CLIENT_ID" | tr -d '\n\r ')
          CLEAN_CSEC=$(printf '%s' "$INFISICAL_CLIENT_SECRET" | tr -d '\n\r ')

          set +e
          INFISICAL_TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id="$CLEAN_CID" \
            --client-secret="$CLEAN_CSEC" \
            --domain="$INFISICAL_DOMAIN" \
            --plain --silent 2>/dev/null)
          LOGIN_RC=$?
          set -e

          if [ $LOGIN_RC -ne 0 ] || [ -z "$INFISICAL_TOKEN" ]; then
            echo "::warning::Infisical login failed — falling back to the static NPM_TOKEN secret."
            exit 0
          fi
          export INFISICAL_TOKEN

          set +e
          RESOLVED=$(infisical secrets get "$NPM_KEY" \
            --domain="$INFISICAL_DOMAIN" \
            --projectId="$NPM_PROJECT" \
            --env="$NPM_ENV" \
            --token="$INFISICAL_TOKEN" \
            --plain --silent 2>/dev/null | tr -d '\n\r ')
          GET_RC=$?
          set -e

          if [ $GET_RC -ne 0 ] || [ -z "$RESOLVED" ]; then
            echo "::warning::Could not read $NPM_KEY from Infisical ($NPM_ENV) — falling back to the static NPM_TOKEN secret."
            exit 0
          fi

          echo "::add-mask::$RESOLVED"
          echo "NPM_INSTALL_TOKEN=$RESOLVED" >> "$GITHUB_ENV"
          echo "Using $NPM_KEY from Infisical ($NPM_ENV) for the install token."

      - name: Configure npm registry auth
        # Trim trailing whitespace from the token — see deploy-reusable
        # for the full diagnosis. Mirrors the same fix; mandatory for
        # every reusable workflow that writes _authToken to .npmrc.
        #
        # npmjs is the ONLY registry: GitHub Packages was retired on
        # 2026-08-25. Never re-add an @symbo-ls:registry route to
        # npm.pkg.github.com (billing-metered transfer 403s every
        # tarball under org spending lock) — see deploy-reusable.yml.
        env:
          # Infisical-resolved token first (step above), static secret as
          # the fallback — the pre-2026-09-12 behaviour.
          _RAW_NPM_TOKEN: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
        run: |
          NPM_TOKEN=$(printf '%s' "$_RAW_NPM_TOKEN" | tr -d '\n\r ')
          # Write to both: NPM_CONFIG_USERCONFIG (npm reads) + workspace
          # root .npmrc (bun reads from cwd up; doesn't honor
          # NPM_CONFIG_USERCONFIG). See deploy-reusable for the diagnosis.
          write_npmrc() {
            local target="$1"
            {
              [ -n "$NPM_TOKEN" ] && echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" && echo "always-auth=true"
            } >> "$target"
          }
          if [ -z "$NPM_TOKEN" ]; then
            # Fail fast with an actionable pointer instead of letting
            # bun install 404 on every restricted package (looks like a
            # network outage rather than a missing secret).
            if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ]; then
              echo "::error::NPM_TOKEN is empty on a Dependabot-triggered run."
              echo "::error::Dependabot uses its own secrets namespace. Add NPM_TOKEN at:"
              echo "::error::  https://github.com/organizations/symbo-ls/settings/secrets/dependabot"
            else
              echo "::error::NPM_TOKEN is empty. Set the org-level Actions secret at:"
              echo "::error::  https://github.com/organizations/symbo-ls/settings/secrets/actions"
            fi
            exit 1
          fi
          write_npmrc "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          write_npmrc "$GITHUB_WORKSPACE/.npmrc"

      - name: Install (pulls newly published upstream versions)
        # `shell: bash` gives `-eo pipefail`; without it `bun install | tee`
        # returns tee's status and a failed install reports green. See the
        # Install step in test-reusable.yml (measured on sdk run 34691267427).
        shell: bash
        env:
          # Must agree with the .npmrc written above, or a project-local
          # .npmrc re-authenticates the install with the weaker token.
          NPM_TOKEN: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
          NPM_SECRET: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN_NPM: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
        # `bun install` honors `workspaces` in package.json natively —
        # no `--workspaces` flag like npm. `--ignore-scripts` suppresses
        # postinstall/prepare so dist-only packages don't build before
        # devDeps are linked; explicit build step runs them next.
        #
        # Retry on npm propagation race: consumer-test runs precisely
        # when upstream just published, so the race window is tightest
        # here. Linear backoff (15s/30s/45s/60s) on the propagation-race
        # signature only — other errors fail fast.
        run: |
          LOG=$(mktemp)
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if bun install --ignore-scripts 2>&1 | tee "$LOG"; then
              exit 0
            fi
            # A 404 on a restricted @symbo.ls/* package is an AUTH verdict,
            # never a propagation race — see test-reusable.yml.
            if grep -qE "registry\.npmjs\.org/@symbo\.ls%2f[^ ]* - 404" "$LOG"; then
              echo "::error::bun install got 404 on a restricted @symbo.ls/* package — the install token has no read on the scope (or is empty). Check the 'Resolve npm install token from Infisical' step above: if it fell back, grant the CI identity read on NPM_TOKEN_PUBLISH in Infisical."
              exit 1
            fi
            if ! grep -qE "(No version matching|ETARGET|failed to resolve)" "$LOG"; then
              echo "::error::bun install failed (not a propagation race) — failing fast"
              exit 1
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              wait=$((15 * attempt))
              echo "::warning::npm propagation race detected (attempt $attempt/$MAX_ATTEMPTS), sleeping ${wait}s before retry"
              sleep "$wait"
            fi
          done
          echo "::error::bun install failed after $MAX_ATTEMPTS attempts — npm propagation did not catch up"
          exit 1

      - name: Build workspace packages
        # `bun run --filter '*' build` runs the `build` script in every
        # workspace package that declares one (matches the npm
        # `--workspaces --if-present` semantics).
        #
        # A build failure MUST fail the job — see the matching comment in
        # test-reusable.yml. `|| true` swallowed it outright, and `cmd |
        # tail` returns *tail's* status, so the pipe alone would still mask
        # it; `shell: bash` supplies `-eo pipefail` (the default
        # `bash -e {0}` has no pipefail) so the build's status is what counts.
        shell: bash
        run: bun run --filter '*' build 2>&1 | tail -100

      - name: Run tests
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          CHANNEL: ${{ github.ref_name == 'main' && 'test' || github.ref_name }}
        run: |
          if [ -f "scripts/test.sh" ]; then
            bash scripts/test.sh
          elif jq -e '.scripts.test' package.json > /dev/null; then
            bun run test
          else
            echo "No tests configured."
          fi
