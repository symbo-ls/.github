# Reusable Test workflow.
#
# Called from each consumer repo's tiny .github/workflows/test.yml
# wrapper. Single source of truth: change this file in release-manager,
# every consumer's next push picks up the change.
#
# Behavior contract:
#   - install workspace deps (bun install)
#   - build any --if-present builds (bun run build --workspaces)
#   - run scripts/test.sh if present, else `bun test`, else no-op pass
#   - test-result is the workflow's conclusion (gates notify-release)
#
# Why bun: org-wide migration away from npm. Bun installs an order of
# magnitude faster, honors workspaces natively, and matches the runtime
# consumer repos already use for `bun run build`. Server still runs npm
# (binary deps); every other repo standardizes on bun via this workflow.

name: Test (reusable)

on:
  workflow_call:
    inputs:
      # Optional environment hints for repos that need them in scripts/test.sh
      # (sdk uses CHANNEL to pick the live API target, for example).
      channel:
        type: string
        required: false
        default: ''
      suite:
        type: string
        required: false
        default: 'smoke'
      # Where the npm INSTALL token lives in Infisical. Defaults match the
      # org's layout as measured 2026-09-12: NPM_TOKEN_PUBLISH exists ONLY
      # in project a95028f1 (envs `staging` and `production`); the critical
      # project ba3c1190 holds just the read-scoped NPM_TOKEN. Overridable
      # so a caller can point elsewhere without forking this workflow.
      infisical_npm_project:
        type: string
        required: false
        default: 'a95028f1-c89b-4d5e-87a2-d6badfb3ab4b'
      # `production` is the env release-manager's release.yml reads this
      # key from today, with a working identity. Infisical scopes an
      # identity's project role per environment, so match the proven one.
      infisical_npm_env:
        type: string
        required: false
        default: 'production'
      infisical_npm_key:
        type: string
        required: false
        default: 'NPM_TOKEN_PUBLISH'
    secrets:
      # Static, read-only on @symbo.ls. Set per consumer repo.
      NPM_TOKEN:
        required: false
      # The org's single GitHub PAT. RELEASE_PAT is the ONLY name for it since
      # 2026-08-08 (it replaced GH_PACKAGES_TOKEN, RELEASE_MANAGER_PAT,
      # RELEASE_MANAGER_DISPATCH_TOKEN and GITHUB_PACKAGES_TOKEN, whose repo-
      # level copies are deleted). Kept declared for caller compatibility;
      # NOT consumed here anymore — GitHub Packages was retired on
      # 2026-08-25, and every package (incl. the npm:@symbo.ls/internal-*
      # aliases for the former @symbo-ls/* scope) resolves from
      # registry.npmjs.org with NPM_TOKEN.
      RELEASE_PAT:
        required: false
      # Optional: only sdk uses these (live API smoke tests). Most repos
      # leave them unset and the test step is a no-op for that branch.
      INFISICAL_CLIENT_ID:
        required: false
      INFISICAL_CLIENT_SECRET:
        required: false
      INFISICAL_PROJECT_ID:
        required: false
      INFISICAL_DOMAIN:
        required: false

jobs:
  test:
    runs-on: namespace-profile-smbls
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pin bun to the version the repo declares in package.json
      # `packageManager` (workspace pins bun@1.3.14, sdk bun@1.3.6).
      # `latest` is a live hazard: a newer bun rewrites bun.lock to
      # lockfile v3, which the pinned local toolchain cannot read, and
      # every plane (dev server, deploy, publish) then fails on the
      # lockfile. Repos with no `packageManager` keep `latest`.
      - name: Resolve bun version from package.json
        id: bunv
        shell: bash
        run: |
          v=$(jq -r '.packageManager // "" | select(startswith("bun@")) | ltrimstr("bun@")' package.json 2>/dev/null || true)
          echo "version=${v:-latest}" >> "$GITHUB_OUTPUT"
          echo "bun version: ${v:-latest} (from package.json packageManager)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bunv.outputs.version }}
          # `bun-version: latest` makes setup-bun call the
          # oven-sh/bun GitHub API to resolve the latest tag.
          # Anonymous calls share the runner-IP rate limit pool and
          # 401 when exhausted (saw across workspace Test runs incl.
          # 26337932317 + dev/preview runs). Passing GITHUB_TOKEN
          # switches to the per-job authenticated quota (1000/hr).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cache bun's global install cache + repo node_modules. Bun keys
      # its store by package@version, so a cold cache after a release
      # only re-downloads the new tarballs.
      - name: Cache bun + node_modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Resolve the npm INSTALL token from Infisical.
      #
      # Why: `secrets.NPM_TOKEN` is a READ-scoped granular token, and a COLD
      # `bun install` of the restricted @symbo.ls/* family 404s under it
      # (measured 2026-09-10: 20 resolve failures, 9x404) while the publish
      # token resolves every package with 0 failures. `npm view` succeeds
      # under BOTH tokens, so npm is not a valid instrument for this — only
      # a cold bun install reproduces it. A warm node_modules hides the
      # defect until a dependency range actually moves.
      #
      # The tokens are held in Infisical, so CI reads the install token from
      # there. That keeps ONE source of truth and makes rotation reach CI
      # without a secret copy per repo.
      #
      # This step is OPTIONAL and fails SOFT. A caller without Infisical
      # creds, or a login/fetch that fails, leaves NPM_INSTALL_TOKEN unset
      # and the next step falls back to `secrets.NPM_TOKEN` exactly as
      # before. Never let a secrets-backend outage turn into a red gate.
      - name: Resolve npm install token from Infisical
        shell: bash
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          NPM_PROJECT: ${{ inputs.infisical_npm_project }}
          NPM_ENV: ${{ inputs.infisical_npm_env }}
          NPM_KEY: ${{ inputs.infisical_npm_key }}
        run: |
          if [ -z "${INFISICAL_CLIENT_ID:-}" ] || [ -z "${INFISICAL_CLIENT_SECRET:-}" ]; then
            echo "::notice::Infisical not configured on this repo — using the static NPM_TOKEN secret."
            exit 0
          fi

          if ! command -v infisical > /dev/null 2>&1; then
            # Same recipe as deploy-reusable.yml: the GitHub release CDN,
            # with the apt mirror only as a fallback (that mirror
            # periodically serves a corrupt Packages index mid-sync).
            INF_VER=0.43.79
            if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
                 "https://github.com/Infisical/cli/releases/download/v${INF_VER}/cli_${INF_VER}_linux_amd64.tar.gz" -o /tmp/infisical.tgz; then
              sudo tar -xzf /tmp/infisical.tgz -C /usr/local/bin infisical
              sudo chmod +x /usr/local/bin/infisical
            else
              echo "::warning::GitHub release download failed — falling back to Infisical apt repo."
              curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo bash
              sudo apt-get install -y "infisical=${INF_VER}"
            fi
          fi

          # Universal-auth rejects payloads with newlines in the body
          # fields, and a secret set with a trailing newline 401s as
          # "Invalid credentials". Trim defensively.
          CLEAN_CID=$(printf '%s' "$INFISICAL_CLIENT_ID" | tr -d '\n\r ')
          CLEAN_CSEC=$(printf '%s' "$INFISICAL_CLIENT_SECRET" | tr -d '\n\r ')

          set +e
          INFISICAL_TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id="$CLEAN_CID" \
            --client-secret="$CLEAN_CSEC" \
            --domain="$INFISICAL_DOMAIN" \
            --plain --silent 2>/dev/null)
          LOGIN_RC=$?
          set -e

          if [ $LOGIN_RC -ne 0 ] || [ -z "$INFISICAL_TOKEN" ]; then
            echo "::warning::Infisical login failed — falling back to the static NPM_TOKEN secret."
            exit 0
          fi
          export INFISICAL_TOKEN

          set +e
          RESOLVED=$(infisical secrets get "$NPM_KEY" \
            --domain="$INFISICAL_DOMAIN" \
            --projectId="$NPM_PROJECT" \
            --env="$NPM_ENV" \
            --token="$INFISICAL_TOKEN" \
            --plain --silent 2>/dev/null | tr -d '\n\r ')
          GET_RC=$?
          set -e

          if [ $GET_RC -ne 0 ] || [ -z "$RESOLVED" ]; then
            echo "::warning::Could not read $NPM_KEY from Infisical ($NPM_ENV) — falling back to the static NPM_TOKEN secret."
            exit 0
          fi

          # Mask BEFORE the value can reach any later log line.
          echo "::add-mask::$RESOLVED"
          echo "NPM_INSTALL_TOKEN=$RESOLVED" >> "$GITHUB_ENV"
          echo "Using $NPM_KEY from Infisical ($NPM_ENV) for the install token."

      - name: Configure npm registry auth
        # Trim trailing whitespace from the token before writing .npmrc.
        # GitHub secrets are stored as raw bytes — a trailing newline
        # in the secret value embeds \n in the _authToken= line, which
        # corrupts the Authorization header npm sends. The registry
        # then treats the request as anonymous and 404s on restricted
        # @symbo.ls/* packages.
        #
        # npmjs is the ONLY registry: GitHub Packages was retired on
        # 2026-08-25. Never re-add an @symbo-ls:registry route to
        # npm.pkg.github.com — its transfer is metered on the org
        # spending block and 403s on every tarball once the billing
        # limit is hit (metadata still 200s). See deploy-reusable.yml.
        env:
          # NPM_INSTALL_TOKEN comes from the Infisical step above when that
          # repo has the creds. Otherwise it is empty and the static
          # secret is used, which is the pre-2026-09-12 behaviour.
          _RAW_NPM_TOKEN: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
        run: |
          NPM_TOKEN=$(printf '%s' "$_RAW_NPM_TOKEN" | tr -d '\n\r ')
          # Write to both the user-config path AND the workspace-root
          # .npmrc — bun reads from cwd upward and does NOT honor
          # NPM_CONFIG_USERCONFIG (npm-only env var). See
          # deploy-reusable for the full diagnosis.
          write_npmrc() {
            local target="$1"
            {
              if [ -n "$NPM_TOKEN" ]; then
                echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN"
                echo "always-auth=true"
              fi
            } >> "$target"
          }
          if [ -z "$NPM_TOKEN" ]; then
            if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ]; then
              # Dependabot draws from its own secrets namespace, and the
              # org Dependabot secrets are scoped to private repos — on a
              # public repo (e.g. symbols-mcp) the token is ALWAYS empty
              # here, which used to hard-fail every dependabot PR even
              # when the repo needs no registry auth at all. Public
              # installs need no token, so continue unauthenticated;
              # repos that do pull restricted @symbo.ls/* packages fail
              # honestly at Install with 404s instead. If that happens,
              # widen the org Dependabot secret visibility or add
              # repo-level Dependabot secrets:
              # https://github.com/organizations/symbo-ls/settings/secrets/dependabot
              echo "::warning::NPM_TOKEN is empty on this Dependabot run — continuing without npm registry auth (public installs only). Restricted @symbo.ls/* installs will 404; add Dependabot-namespace secrets if this repo needs them."
            else
              # Fail fast with an actionable pointer. Warn-and-continue
              # here made the install step 404 on every restricted
              # @symbo.ls/* package, which looks like a network outage
              # rather than a missing secret — burns 20+ min of
              # debugging per occurrence.
              echo "::error::NPM_TOKEN is empty. Configure the org-level Actions secret:"
              echo "::error::  https://github.com/organizations/symbo-ls/settings/secrets/actions"
              echo "::error::(Use the granular access token with read on @symbo.ls/* on npmjs.org.)"
              exit 1
            fi
          fi
          write_npmrc "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          write_npmrc "$GITHUB_WORKSPACE/.npmrc"

      - name: Install
        # `shell: bash` gives `-eo pipefail`. Without it, `bun install | tee`
        # returns TEE's exit code, the `if` takes the success branch, and a
        # failed install reports green — measured on sdk run 34691267427
        # (2026-09-12): 404 on @symbo.ls/analyze, step status "success",
        # then the build died on a missing bin. Same trap the Build step
        # below already documents.
        shell: bash
        env:
          # Aliases for repos with project-local .npmrc using these names.
          # Same precedence as the auth step: Infisical first, static
          # secret as the fallback. These MUST agree with the .npmrc the
          # step above wrote, or a project-local .npmrc silently
          # re-authenticates the install with the weaker token.
          NPM_TOKEN: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
          NPM_SECRET: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN_NPM: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_INSTALL_TOKEN || secrets.NPM_TOKEN }}
        # `bun install` honors `workspaces` in package.json natively —
        # no `--workspaces` flag like npm. `--ignore-scripts` suppresses
        # postinstall/prepare hooks so dist-only packages don't try to
        # build before their devDeps are linked; we run them explicitly
        # in the next step.
        #
        # Retry on npm propagation race: release-manager publishes
        # packages and pushes consumer chore(release) bumps in lockstep,
        # but npm has multiple read replicas with eventual consistency.
        # An install that hits an un-synced replica fails with
        #   error: No version matching "^X.Y.Z" found for specifier "@symbo.ls/*"
        # The retry waits with linear backoff (15s, 30s, 45s, 60s) on
        # this specific signature only — other errors fail fast.
        run: |
          LOG=$(mktemp)
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if bun install --ignore-scripts 2>&1 | tee "$LOG"; then
              exit 0
            fi
            # A 404 on a restricted @symbo.ls/* package is an AUTH verdict
            # (the registry hides restricted packages from a token without
            # read on the scope), never a propagation race. Retrying it
            # burned 2.5 min per run (sdk run 34691472701). Fail fast and
            # name the cause.
            if grep -qE "registry\.npmjs\.org/@symbo\.ls%2f[^ ]* - 404" "$LOG"; then
              echo "::error::bun install got 404 on a restricted @symbo.ls/* package — the install token has no read on the scope (or is empty). Check the 'Resolve npm install token from Infisical' step above: if it fell back, grant the CI identity read on NPM_TOKEN_PUBLISH in Infisical."
              exit 1
            fi
            if ! grep -qE "(No version matching|ETARGET|failed to resolve)" "$LOG"; then
              echo "::error::bun install failed (not a propagation race) — failing fast"
              exit 1
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              wait=$((15 * attempt))
              echo "::warning::npm propagation race detected (attempt $attempt/$MAX_ATTEMPTS), sleeping ${wait}s before retry"
              sleep "$wait"
            fi
          done
          echo "::error::bun install failed after $MAX_ATTEMPTS attempts — npm propagation did not catch up"
          exit 1

      # Some workspace packages ship dist-only and need an explicit
      # build because --ignore-scripts above suppressed prepare hooks.
      # `bun run --filter '*' build` runs the `build` script in every
      # workspace package that declares one (matches the npm
      # `--workspaces --if-present` semantics).
      # A build failure MUST fail the job. Two things previously stopped
      # that from happening, and both had to go:
      #   1. `|| true` swallowed the exit code outright.
      #   2. even without it, `cmd | tail` returns *tail's* status, so the
      #      pipe alone was enough to mask a failure. `shell: bash` gives
      #      `-eo pipefail` (the default `bash -e {0}` has no pipefail),
      #      which makes the pipeline report the build's status instead.
      # Output is still capped at the last 100 lines to keep logs readable.
      - name: Build workspace packages
        shell: bash
        run: bun run --filter '*' build 2>&1 | tail -100

      - name: Test
        env:
          # Pass through Infisical creds for repos that need live API
          # smoke tests (sdk). Empty when not set; scripts/test.sh
          # gracefully skips Infisical when missing.
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          # Channel routing: caller passes inputs.channel; if empty,
          # default to current branch with main → test alias.
          CHANNEL: ${{ inputs.channel != '' && inputs.channel || (github.ref_name == 'main' && 'test' || github.ref_name) }}
          SUITE: ${{ inputs.suite }}
        run: |
          if [ -f "scripts/test.sh" ]; then
            bash scripts/test.sh
          elif jq -e '.scripts.test' package.json > /dev/null; then
            bun run test
          else
            echo "No tests configured — install-only smoke test passed."
          fi
